
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Profile</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  padding: 30px;
}

.profile {
  max-width: 850px;
  background: white;
  padding: 25px;
  margin: auto;
  border-radius: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.avatar {
  width: 110px;
  height: 110px;
  background: #bae6fd;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 45px;
  transition: transform 0.25s ease;
}

.avatar:hover {
  transform: scale(1.05);
}

.details {
  width: 100%;
  text-align: center;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 20px 0;
  text-align: center;
}

.buttons {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 7px;
  background: #0284c7;
  color: white;
  cursor: pointer;
}

button:active {
  transform: scale(0.96);
}

.highlights {
  display: flex;
  overflow-x: auto;
  gap: 20px;
  width: 100%;
  padding: 10px;
}

.story {
  flex-shrink: 0;
  text-align: center;
}

.circle {
  width: 60px;
  height: 60px;
  background: #dbeafe;
  border: 2px solid #0284c7;
  border-radius: 50%;
  margin-bottom: 5px;
}

@media (min-width: 768px) {
  .profile {
    flex-direction: row;
    align-items: center;
    flex-wrap: wrap;
  }

  .details {
    flex: 1;
    text-align: left;
  }

  .highlights {
    flex-basis: 100%;
  }
}
</style>
</head>

<body>

<div class="profile">

  <div class="avatar">
    👩
  </div>

  <div class="details">

    <h2>alex_designer</h2>
    <p>UI Engineer</p>

    <div class="stats">
      <div>
        <h3>148</h3>
        <p>Posts</p>
      </div>

      <div>
        <h3>12.4k</h3>
        <p>Followers</p>
      </div>

      <div>
        <h3>420</h3>
        <p>Following</p>
      </div>
    </div>

    <p>Building web design systems and open source widgets.</p>

    <br>

    <div class="buttons">
      <button>Follow</button>
      <button>Message</button>
    </div>

  </div>

  <div class="highlights">

    <div class="story">
      <div class="circle"></div>
      <small>Design</small>
    </div>

    <div class="story">
      <div class="circle"></div>
      <small>Projects</small>
    </div>

    <div class="story">
      <div class="circle"></div>
      <small>Work</small>
    </div>

    <div class="story">
      <div class="circle"></div>
      <small>Tips</small>
    </div>

  </div>

</div>

</body>
</html>
