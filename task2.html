<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Cards</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  padding: 30px;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.toggle {
  display: flex;
  justify-content: center;
  margin-bottom: 25px;
}

.toggle span {
  background: #dbeafe;
  padding: 12px 20px;
  border-radius: 20px;
}

.container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  max-width: 950px;
  margin: auto;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 20px;
  transition: transform 0.25s ease,
              box-shadow 0.25s ease;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 8px 20px #cbd5e1;
}

.pro {
  border: 2px solid #0284c7;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from {
    box-shadow: 0 0 3px #38bdf8;
  }
  to {
    box-shadow: 0 0 12px #38bdf8;
  }
}

button {
  background: #0284c7;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 7px;
  cursor: pointer;
}

@media (min-width: 850px) {
  .container {
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }
}
</style>
</head>

<body>

<h1>Choose Your Plan</h1>

<div class="toggle">
  <span>Monthly | Annual</span>
</div>

<div class="container">

  <div class="card">
    <h2>Starter</h2>
    <h3>Free</h3>
    <p>✔ Basic Features</p>
    <p>✔ 1 User</p>
    <p>✔ Basic Support</p>
    <button>Select</button>
  </div>

  <div class="card pro">
    <h2>Pro Plan ⭐ Popular</h2>
    <h3>₹799/mo</h3>
    <p>✔ All Basic Features</p>
    <p>✔ 5 Users</p>
    <p>✔ Priority Support</p>
    <button>Select</button>
  </div>

  <div class="card">
    <h2>Team</h2>
    <h3>₹1,999/mo</h3>
    <p>✔ All Pro Features</p>
    <p>✔ Unlimited Users</p>
    <p>✔ Team Support</p>
    <button>Select</button>
  </div>

</div>

</body>
</html>
